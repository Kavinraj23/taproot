# Taproot's own stack. The OpenTelemetry demo is added in M1.
# Redpanda is separate from the demo's Kafka so monitoring doesn't share its failure modes.
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --memory=512M
      # Two listeners: containers reach redpanda:29092, the host reaches localhost:9092.
      # Clients follow the advertised address, so one listener can't serve both.
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:29092,external://localhost:9092
    ports: ["9092:9092"]
    volumes: ["redpanda-data:/var/lib/redpanda/data"]
    restart: unless-stopped # come back after a Docker Desktop restart
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -Eq 'Healthy:.+true'"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Creates Taproot's topics once Redpanda is up, so nothing relies on auto-creation.
  # taproot.metrics is keyed by series and taproot.spans by trace ID, so 3 partitions still
  # keep each series (and each trace) in order. Every topic must come out OK or already exist.
  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.11
    depends_on:
      redpanda: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        for t in taproot.metrics taproot.spans; do
          out=$$(rpk topic create $$t -p 3 -X brokers=redpanda:29092 2>&1);
          echo "$$out";
          echo "$$out" | grep -Eq 'OK|TOPIC_ALREADY_EXISTS' || exit 1;
        done
    restart: "no"

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    # Without a password the image only allows the default user from inside the container.
    environment:
      CLICKHOUSE_USER: taproot
      CLICKHOUSE_PASSWORD: taproot
      CLICKHOUSE_DB: taproot
    ports: ["8123:8123", "9000:9000"]
    volumes: ["clickhouse-data:/var/lib/clickhouse"]
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    restart: unless-stopped
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "taproot", "--password", "taproot", "-q", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Reads CPU from /proc/stat. Inside a container that's the Docker VM's CPU (not Windows').
  # pid: host lets discovery see every process in the Docker VM, not just its own.
  # Reading other users' /proc/<pid>/fd and exe needs ptrace-read access: root plus SYS_PTRACE.
  # Without them the scan still lists processes, but with no exe and no listening ports.
  # The Docker socket lets discovery name each process's container. Read-only doesn't limit the
  # API: whoever holds the socket can control Docker (the same trade-off cAdvisor and Datadog make).
  agent:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { CMD: agent } }
    hostname: docker-vm # stable series name across container recreations
    pid: host
    user: "0"
    cap_add: [SYS_PTRACE]
    # agent-buffer is the disk buffer (internal/spool): points and spans wait there while
    # Redpanda is down, and survive an agent restart. Points are capped at TAPROOT_BUFFER_MAX_MB
    # (256 MB, ~9 hours); spans, in their own folder, at TAPROOT_SPAN_BUFFER_MAX_MB (1 GB, ~2
    # hours at ~112 spans/s x 1.35 KB, measured 2026-11-23).
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - agent-buffer:/var/lib/taproot/buffer
    environment:
      TAPROOT_BROKERS: redpanda:29092
      # The one login the sensors need: the demo's read-only monitoring user (decision 0005).
      TAPROOT_POSTGRES_USER: ${TAPROOT_POSTGRES_USER:-monitoring_user}
      TAPROOT_POSTGRES_PASSWORD: ${TAPROOT_POSTGRES_PASSWORD:-monitoring_password}
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
    restart: unless-stopped
    mem_limit: 64m

  processor:
    build: { context: .., dockerfile: deploy/Dockerfile, args: { CMD: processor } }
    environment:
      TAPROOT_BROKERS: redpanda:29092
      TAPROOT_CLICKHOUSE_ADDR: clickhouse:9000
    depends_on:
      redpanda-init: { condition: service_completed_successfully }
      clickhouse: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 128m

  postgres:
    image: postgres:16.6
    environment:
      POSTGRES_USER: taproot
      POSTGRES_PASSWORD: taproot
      POSTGRES_DB: taproot
    ports: ["5433:5432"]  # 5433 so it doesn't clash with the demo's Postgres
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    restart: unless-stopped
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.4.0
    # 4.14.0 is the newest plugin release that supports Grafana 11.4 (4.15+ needs 11.6).
    environment:
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.14.0
    ports: ["3001:3000"]  # 3001 so it doesn't clash with the demo's Grafana
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
    mem_limit: 256m

volumes:
  agent-buffer:
  redpanda-data:
  clickhouse-data:
  postgres-data:
  grafana-data:
